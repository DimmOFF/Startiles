<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="groups-wrap"><nav id="groups"></nav></div>

  <button id="settings-btn" class="icon-btn" title="Quick settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>

  <form id="search" autocomplete="off">
    <img id="engine-ico" alt="" draggable="false">
    <input id="q" type="text" spellcheck="false">
  </form>

  <main id="grid" class="grid" data-merge="1"></main>

  <footer id="foot"><button id="add-btn" class="pill">+ Shortcut</button></footer>

  <div id="folder-layer" hidden></div>
  <div id="ctx" hidden></div>
  <dialog id="dlg"></dialog>

  <aside id="settings" class="panel">
    <header><h3>Quick Settings</h3><button id="settings-close" class="icon-btn" title="Close">&times;</button></header>

    <section>
      <h4>Start Page</h4>
      <label class="row"><span>Show Add Button</span><input type="checkbox" class="switch" data-key="showAdd"></label>
      <label class="row"><span>Show Search Field</span><input type="checkbox" class="switch" data-key="showSearch"></label>
      <label class="row"><span>Search Engine</span><select data-key="engine"></select></label>
      <label class="row"><span>Page Background</span><input type="color" data-key="pageBg"></label>
    </section>

    <section>
      <h4>Speed Dials</h4>
      <label class="row col"><span>Thumbnail Size <output></output></span><input type="range" min="120" max="420" step="2" data-key="tileWidth" data-unit="px"></label>
      <label class="row col"><span>Horizontal Gap <output></output></span><input type="range" min="0" max="80" step="1" data-key="gapX" data-unit="px"></label>
      <label class="row col"><span>Vertical Gap <output></output></span><input type="range" min="0" max="80" step="1" data-key="gapY" data-unit="px"></label>
      <label class="row"><span>Speed Dial Title</span><input type="checkbox" class="switch" data-key="showTitles"></label>
      <label class="row"><span>Show Delete Button</span><input type="checkbox" class="switch" data-key="showDelete"></label>
      <label class="row"><span>Icon Thumbnail Background</span><input type="color" data-key="thumbBg"></label>
    </section>

    <details>
      <summary>Advanced Settings</summary>
      <label class="row col"><span>Groups Bar Top Offset <output></output></span><input type="range" min="0" max="200" step="1" data-key="groupsTop" data-unit="px"></label>
      <label class="row col"><span>Search Top Offset <output></output></span><input type="range" min="0" max="300" step="1" data-key="searchTop" data-unit="px"></label>
      <label class="row col"><span>Folder Window Size <output></output></span><input type="range" min="40" max="100" step="1" data-key="folderSize" data-unit="%"></label>
      <label class="row col"><span>Folder Animation <output></output></span><input type="range" min="150" max="900" step="10" data-key="animMs" data-unit="ms"></label>
    </details>

    <details>
      <summary>Google Drive Sync (thumbnails)</summary>
      <label class="row col"><span>OAuth Client ID (Web application)</span><input type="text" data-key="driveClientId" placeholder="xxxx.apps.googleusercontent.com"></label>
      <label class="row col"><span>Redirect URI to register</span><input type="text" id="redirect-uri" readonly></label>
      <label class="row"><span>Auto-sync after changes</span><input type="checkbox" class="switch" data-key="driveAuto"></label>
      <div class="row"><button id="sync-btn" class="pill sm">Sync now</button><span id="sync-status"></span></div>
    </details>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
