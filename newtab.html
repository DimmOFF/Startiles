<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
<script src="js/theme-boot.js"></script>
</head>
<body>
  <div id="groups-wrap"><nav id="groups"></nav></div>

  <button id="settings-btn" class="icon-btn" title="Quick settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>

  <form id="search" autocomplete="off">
    <img id="engine-ico" alt="" draggable="false">
    <input id="q" type="text" spellcheck="false">
    <button type="button" id="q-clear" title="Clear" aria-label="Clear" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </form>

  <main id="grid" class="grid" data-merge="1"></main>

  <footer id="foot"><button id="add-btn" class="pill">+ Shortcut</button></footer>

  <div id="folder-layer" hidden></div>
  <div id="ctx" hidden></div>
  <div id="tip" hidden></div>
  <dialog id="dlg"></dialog>
  <dialog id="picker"></dialog>

  <aside id="settings" class="panel">
    <header><h3>Quick Settings</h3><button id="settings-close" class="icon-btn" title="Close">&times;</button></header>
    <div id="quick-body"></div>
  </aside>

  <dialog id="adv" class="wide">
    <div class="advwrap">
      <header><h3>Advanced Settings</h3><button id="adv-close" class="icon-btn" title="Close">&times;</button></header>
      <nav id="adv-tabs" class="tabs"></nav>
      <div id="adv-body" class="advbody"></div>
      <footer class="advfoot">
        <button id="exp-btn" class="pill sm">Export</button>
        <button id="imp-btn" class="pill sm">Import</button>
        <span class="vsep"></span>
        <button id="reset-btn" class="pill sm warn">Reset to Default</button>
        <input id="imp-file" type="file" accept=".json,application/json" hidden>
        <span id="backup-status"></span>
        <span class="sp"></span>
        <a id="donate" class="pill sm" href="https://github.com/DimmOFF/DMF-Assets/blob/main/donation/DONATE.md" target="_blank" rel="noopener noreferrer">&#9829; Donate</a>
      </footer>
    </div>
  </dialog>

  <dialog id="reset-dlg" class="small">
    <form id="reset-form" class="dform">
      <h3>Reset to Default</h3>
      <p class="note">Choose what to reset:</p>
      <label class="rchk"><input type="checkbox" data-k="settings"><b>Settings</b>
        <small>All options (sizes, layout, animations, search engine, background image…) except themes.</small></label>
      <label class="rchk"><input type="checkbox" data-k="themes"><b>Themes</b>
        <small>Your custom themes are deleted and the theme is set to Auto.</small></label>
      <label class="rchk"><input type="checkbox" data-k="dials"><b>Speed Dials</b>
        <small>Groups, tiles and folders of the Startiles Speed Dial folder. One empty group is left.</small></label>
      <label class="rchk sub"><input type="checkbox" data-k="userThumbs"><b>User previews</b>
        <small>Images, icons and Pageview choices you set for tiles.</small></label>
      <label class="rchk sub"><input type="checkbox" data-k="cache"><b>Cached previews</b>
        <small>Automatically fetched icons, page previews and screenshots.</small></label>
      <p id="reset-note" class="rcallout" hidden></p>
      <div class="btns"><span class="sp"></span>
        <button type="button" id="reset-cancel">Cancel</button>
        <button type="submit" id="reset-ok" class="primary danger-ok" disabled>Confirm</button></div>
    </form>
  </dialog>

  <dialog id="bk-dlg" class="small">
    <form id="bk-form" class="dform">
      <h3 id="bk-title">Export</h3>
      <p class="note" id="bk-lead"></p>
      <div id="bk-items" class="rlist"></div>
      <p id="bk-note" class="rcallout" hidden></p>
      <div class="btns"><span class="sp"></span>
        <button type="button" id="bk-cancel">Cancel</button>
        <button type="submit" id="bk-ok" class="primary">Export</button></div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
